<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>My Media</title>

		<!-- Tailwind CDN -->
		<script src="https://cdn.tailwindcss.com"></script>

		<!-- HTMX -->
		<script src="https://unpkg.com/htmx.org@1.9.10"></script>
		<!-- DaisyUI -->
		<link
			href="https://cdn.jsdelivr.net/npm/daisyui@5"
			rel="stylesheet"
			type="text/css"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
			rel="stylesheet"
			type="text/css"
		/>
		<!-- Alpine.js -->
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
		></script>

		<style>
			/* CARD-FLIP */
			.flip-card {
				background-color: transparent;
				width: 100%;
				height: 100%;
				perspective: 1000px;
			}

			.flip-card-inner {
				position: relative;
				width: 100%;
				height: 100%;
				text-align: center;
				transition: transform 0.6s;
				transform-style: preserve-3d;
			}

			.flip-card.spinning .flip-card-inner {
				transform: rotateY(180deg);
			}

			.flip-card-front,
			.flip-card-back {
				position: absolute;
				width: 100%;
				height: 100%;
				-webkit-backface-visibility: hidden;
				backface-visibility: hidden;
			}

			.flip-card-back {
				transform: rotateY(180deg);
			}
		</style>
	</head>

	<body
		x-data="{ search: '', showSearch: false }"
		@keydown.window.prevent.slash="showSearch = true; $nextTick(() => {window.scrollTo({ top: 0, behavior: 'smooth' }); $refs.search.focus();})"
		@keydown.escape.window="showSearch = false; search='';">
		<div class="max-w-6xl mx-auto p-6">
			<div class="navbar bg-base-100 shadow-sm mb-4 relative z-50">
				<div class="navbar-start">
					<div class="dropdown">
						<div tabindex="0" role="button" class="btn btn-ghost btn-circle">
							<svg
								xmlns="http://www.w3.org/2000/svg"
								class="h-5 w-5"
								fill="none"
								viewBox="0 0 24 24"
								stroke="currentColor"
							>
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="2"
									d="M4 6h16M4 12h16M4 18h7"
								/>
							</svg>
						</div>
						<ul
							tabindex="-1"
							class="menu menu-sm dropdown-content bg-base-100 rounded-box z-[100] mt-3 w-52 p-2 shadow"
						>
							<li><a href="/">🏠 Homepage</a></li>
							<li><a>🎬 Movie Collection</a></li>
							<li><a>ℹ️ About</a></li>
						</ul>
					</div>
				</div>
				<div class="navbar-center">
					<a href="/" class="btn btn-ghost text-xl font-black tracking-tighter">💽 ALBUM COLLECTION</a>
				</div>
				<div class="navbar-end gap-1">
					<!-- Search Toggle -->
					<div class="flex items-center">
						<div x-show="showSearch" class="relative mr-2">
							<input
								x-ref="search"
								type="text"
								x-model.debounce.500ms="search"
								placeholder="Search..."
								class="input input-bordered input-sm w-32 md:w-48"
							/>
							<button
								@click="showSearch = false; search = ''"
								class="absolute right-2 top-1/2 -translate-y-1/2 opacity-50 hover:opacity-100"
							>
								✕
							</button>
						</div>
						<button
							x-show="!showSearch"
							@click="showSearch = true; $nextTick(() => $refs.search.focus())"
							class="btn btn-ghost btn-circle btn-sm"
						>
							<svg
								xmlns="http://www.w3.org/2000/svg"
								class="h-5 w-5"
								fill="none"
								viewBox="0 0 24 24"
								stroke="currentColor"
							>
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="2"
									d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
								/>
							</svg>
						</button>
					</div>

					<!-- Sort and Filter Dropdown -->
					<div class="dropdown dropdown-end">
						<div tabindex="0" role="button" class="btn btn-ghost btn-circle btn-sm">
							<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
							</svg>
						</div>
						<div tabindex="0" class="dropdown-content bg-base-100 rounded-box z-[100] mt-3 w-64 p-4 shadow-2xl border border-base-200">
							<div class="space-y-4">
								<div class="form-control w-full">
									<label class="label pt-0">
										<span class="label-text font-bold">Sort By</span>
									</label>
									<select 
										name="sort" 
										class="select select-bordered select-sm w-full"
										hx-get="/albums"
										hx-target="#album-grid"
										hx-trigger="change"
										hx-include="[name='min_rating']"
									>
										<option value="year_desc">Newest First</option>
										<option value="year_asc">Oldest First</option>
										<option value="artist_asc">Artist (A-Z)</option>
										<option value="title_asc">Title (A-Z)</option>
										<option value="rating_desc">Highest Rated</option>
									</select>
								</div>

								<div class="form-control w-full">
									<label class="label">
										<span class="label-text font-bold">Min Rating</span>
									</label>
									<select 
										name="min_rating" 
										class="select select-bordered select-sm w-full"
										hx-get="/albums"
										hx-target="#album-grid"
										hx-trigger="change"
										hx-include="[name='sort']"
									>
										<option value="0">All Ratings</option>
										<option value="90">90+ Stars</option>
										<option value="80">80+ Stars</option>
										<option value="70">70+ Stars</option>
										<option value="50">50+ Stars</option>
									</select>
								</div>
							</div>
						</div>
					</div>

					<!-- Theme Toggle -->
					<label class="swap swap-rotate">
						<!-- this hidden checkbox controls the state -->
						<input type="checkbox" class="theme-controller" value="dark" />

						<!-- sun icon -->
						<svg
							class="swap-off h-5 w-5 fill-current"
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
						>
							<path
								d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"
							/>
						</svg>

						<!-- moon icon -->
						<svg
							class="swap-on h-5 w-5 fill-current"
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
						>
							<path
								d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"
							/>
						</svg>
					</label>
				</div>
			</div>
			{% block content %}{% endblock %}
		</div>
		<script>
			document.body.addEventListener("htmx:responseError", function () {
				alert("Server error — changes reverted");
			});
		</script>
	</body>
</html>
