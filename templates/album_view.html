<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 "
x-data="{ showAlbum: true }"
x-show="showAlbum"
@keydown.escape.window="showAlbum=false">
	<div
		class="bg-base-100 text-base-content rounded-lg shadow-lg w-full w-auto max-w-full p-6"
	>
		<h2 class="text-xl font-semibold mb-4">
			{{ album.title }}
		</h2>
<div class="card card-side bg-base-100 shadow-sm">
  <figure class="rounded-none w-full h-full">
    <img
      src="{{ album.cover }}"
      alt="Movie" />
  </figure>

    <div class="card-body w-fit">
      <h2 class="card-title">Song List</h2>
      <ul class="list bg-base-100 rounded-box shadow-md max-w-full">
    
      <li class="p-4 pb-2 text-xs opacity-60 tracking-wide max-w-full">Most played songs this week</li>
      <li class="list-row flex items-center justify-between p-2">
      
      <div class="text-sm font-semibold">Remaining Reason</div>
      <div class="text-sm opacity-70">3:45</div> <!-- Placeholder for song length -->
      <button class="btn btn-square btn-ghost">
        <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></g></svg>
      </button>
        </li>
      </ul>
      </div>
    </li>
    </div>
</div>
	</div>
</div>
